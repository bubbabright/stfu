<!--
  stfu/templates/index.html — Mobile-first volume control UI
  v4.1.0 — MQTT captions, slider, buttons, overlay status
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HDTV Volume</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

:root {
    --accent: #ff5555;
    --bg: #0f0f0f;
    --card: #1a1a1a;
    --card-press: #2a2a2a;
    --text: #eee;
    --muted: #888;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    margin: 0; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    text-align: center;
}

.container { max-width: 480px; margin: auto; }

h1 { font-size: 1.4rem; opacity: 0.7; margin-bottom: 10px; }
.version { font-size: 0.7rem; opacity: 0.5; font-weight: 400; margin-left: 8px; }

/* ── VOLUME CONTROL — one fill-bar row: mute icon + drag bar + big % ── */
.volume-control {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border-radius: 20px;
    padding: 14px 16px; margin: 20px 0;
}
.vol-mute-btn {
    flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%;
    border: none; background: var(--card-press); color: var(--text);
    font-size: 1.4rem; padding: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.08s, background 0.15s;
}
.vol-mute-btn:active { transform: scale(0.92); }
.vol-mute-btn.muted { background: var(--accent); }

.vol-bar {
    flex: 1 1 auto; -webkit-appearance: none; appearance: none;
    height: 48px; border-radius: 24px; outline: none; margin: 0;
    background: linear-gradient(to right,
        var(--vol-fill, #4ade80) var(--pct, 50%),
        #333 var(--pct, 50%));
    transition: background-color 0.15s;
}
.vol-bar.muted { --vol-fill: var(--accent); }
.vol-bar::-webkit-slider-thumb {
    -webkit-appearance: none; width: 6px; height: 36px; border-radius: 3px;
    background: rgba(255,255,255,0.7); box-shadow: 0 0 0 6px rgba(255,255,255,0.15);
}
.vol-bar::-moz-range-thumb {
    width: 6px; height: 36px; border-radius: 3px; border: none;
    background: rgba(255,255,255,0.7);
}
.vol-bar::-moz-range-track { height: 48px; border-radius: 24px; background: transparent; }

.vol-pct {
    flex: 0 0 auto; min-width: 3.4em; text-align: right;
    font-size: 1.9rem; font-weight: 700;
    transition: transform 0.1s ease;
}
.vol-pct.bump { transform: scale(1.08); }

.buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
button {
    font-size: 1.8rem; padding: 22px; border-radius: 18px;
    border: none; background: var(--card); color: var(--text);
    transition: transform 0.08s, background 0.1s;
}
button:active { transform: scale(0.94); background: var(--card-press); }
.mute-btn { grid-column: span 2; font-size: 1.3rem; }
.muted { background: var(--accent); color: white; }
.offline { opacity: 0.5; }

/* ── Landscape: this is a phone control panel, not just a portrait card ── */
@media (orientation: landscape) {
    body { padding: 10px; }
    h1 { font-size: 1.1rem; margin-bottom: 6px; }
    .status-bar { margin: 6px 0; }
    .volume-control { margin: 12px 0; padding: 10px 14px; }
    .vol-mute-btn, .vol-bar { height: 40px; }
    .vol-bar::-webkit-slider-thumb, .vol-bar::-moz-range-thumb { height: 30px; }
    .vol-pct { font-size: 1.5rem; }
    button { padding: 14px; }
    .cc-wrap { height: 90px; margin-top: 14px; }
}

#status { margin-top: 12px; font-size: 0.9rem; color: var(--muted); min-height: 18px; }

/* ── STATUS BAR (data-driven, one entry per backend-dependent component) ── */
.status-bar {
    display: flex; justify-content: center; flex-wrap: wrap; gap: 14px;
    margin: 12px 0; font-size: 0.75rem; color: var(--muted);
}
.status-item { display: flex; align-items: center; gap: 5px; }
.status-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #555; transition: background 0.3s;
}
.status-dot.live { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
.status-dot.dead { background: #ff5555; }

/* ── CC CRAWL — collapses to nothing when no captions are flowing ── */
.cc-wrap {
    margin-top: 28px; background: var(--card); border-radius: 16px;
    height: 120px; overflow: hidden; position: relative;
    transition: height 0.3s ease, opacity 0.3s ease, margin-top 0.3s ease;
}
.cc-wrap.collapsed { height: 0; opacity: 0; margin-top: 0; }
.cc-wrap::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 36px;
    background: linear-gradient(to bottom, var(--card), transparent);
    z-index: 2; pointer-events: none;
}
.cc-inner {
    display: flex; flex-direction: column-reverse;
    padding: 12px 16px; gap: 6px;
    position: absolute; bottom: 0; left: 0; right: 0;
}
.cc-batch {
    font-size: 0.95rem; line-height: 1.45; color: #fff;
    opacity: 0; transform: translateY(12px);
    animation: cc-rise 0.4s ease forwards;
}
.cc-batch.old { opacity: 0.4; font-size: 0.85rem; }
@keyframes cc-rise { to { opacity: 1; transform: translateY(0); } }
</style>
</head>

<body>
<div class="container">
    <h1>HDTV Volume Control <span class="version">v{{ version }}</span></h1>

    <!-- Status bar: one dot per backend-dependent component, built by JS -->
    <div class="status-bar" id="status-bar"></div>

    <div class="volume-control" id="volume-control">
        <button id="btn-mute" class="vol-mute-btn" aria-label="Toggle mute">&#128266;</button>
        <input type="range" id="volume-slider" class="vol-bar" min="0" max="100" value="50">
        <span id="volume-text" class="vol-pct">--%</span>
    </div>

    {% if (theme_enabled and theme_show_in_ui) or nightlight_enabled %}
    <div class="buttons">
        {% if theme_enabled and theme_show_in_ui %}
        <button id="btn-theme" class="mute-btn">Dark Mode</button>
        {% endif %}
        {% if nightlight_enabled %}
        <button id="btn-nightlight" class="mute-btn">Night Light</button>
        {% endif %}
    </div>
    {% endif %}

    <div id="status"></div>

    <!-- CC CRAWL — starts collapsed, expands on first caption -->
    <div class="cc-wrap collapsed" id="cc-wrap">
        <div class="cc-inner" id="cc-inner"></div>
    </div>
</div>

<script>
const POLL_INTERVAL = {{ poll_interval }};
const MAX_BATCHES = 2;

let debounceTimer;
let lastUpdate = 0;
let ccBatches = [];

const volumeText = document.getElementById('volume-text');
const slider = document.getElementById('volume-slider');
const muteBtn = document.getElementById('btn-mute');
const statusEl = document.getElementById('status');
const ccInner = document.getElementById('cc-inner');
const ccWrap = document.getElementById('cc-wrap');
const btnTheme = document.getElementById('btn-theme');

function bump() { volumeText.classList.add('bump'); setTimeout(() => volumeText.classList.remove('bump'), 100); }
function setBarFill(vol, muted) {
    slider.style.setProperty('--pct', vol + '%');
    slider.classList.toggle('muted', muted);
    muteBtn.classList.toggle('muted', muted);
    muteBtn.innerHTML = muted ? '&#128263;' : '&#128266;'; // 🔇 / 🔊
}
function haptic() { if (navigator.vibrate) navigator.vibrate(10); }
function setStatus(msg) { statusEl.textContent = msg; setTimeout(() => statusEl.textContent = '', 1500); }

// ── Status bar: one entry per backend-dependent component, added on demand ──
// so wiring up a future control's liveness indicator is one addStatusItem()
// call, not a bespoke dot/text pair hand-added to the template each time.
const statusBar = document.getElementById('status-bar');
function addStatusItem(id, label) {
    const item = document.createElement('div');
    item.className = 'status-item';
    item.innerHTML = `<span class="status-dot" id="dot-${id}"></span><span id="text-${id}">${label}&hellip;</span>`;
    statusBar.appendChild(item);
    const dot = item.querySelector('.status-dot');
    const text = item.querySelector('span:last-child');
    return {
        live(msg) { dot.className = 'status-dot live'; text.textContent = msg; },
        dead(msg) { dot.className = 'status-dot dead'; text.textContent = msg; },
    };
}
const overlayStatus = addStatusItem('overlay', 'overlay');
const ccStatus = addStatusItem('cc', 'captions');
{% if theme_enabled and theme_show_in_ui %}
const themeStatus = addStatusItem('theme', 'theme');
{% endif %}
{% if nightlight_enabled %}
const nightlightStatus = addStatusItem('nightlight', 'night light');
{% endif %}
{% if mcp_enabled %}
const mcpStatus = addStatusItem('mcp', 'mcp');
{% endif %}

async function fetchVolume() {
    try {
        const res = await fetch('/volume');
        const data = await res.json();
        volumeText.textContent = data.volume + '%';
        slider.value = data.volume;
        setBarFill(data.volume, data.muted);
    } catch { setStatus('connection error'); }
}

async function fetchOverlayStatus() {
    try {
        const res = await fetch('/overlay/status');
        const data = await res.json();
        if (data.active) overlayStatus.live('overlay active');
        else overlayStatus.dead('overlay offline');
    } catch {
        overlayStatus.dead('overlay unknown');
    }
}

{% if mcp_enabled %}
async function fetchMcpStatus() {
    try {
        const res = await fetch('/mcp/status');
        const data = await res.json();
        if (data.active) mcpStatus.live('mcp connected');
        else mcpStatus.dead('mcp offline');
    } catch {
        mcpStatus.dead('mcp unknown');
    }
}
{% endif %}

slider.addEventListener('input', () => {
    const vol = parseInt(slider.value);
    volumeText.textContent = vol + '%';
    slider.style.setProperty('--pct', vol + '%');
    bump();
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(async () => {
        try {
            await fetch('/volume/set', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ volume: vol })
            });
            haptic();
        } catch { setStatus('failed'); }
    }, 120);
});

document.getElementById('btn-mute').onclick = async () => { await fetch('/volume/mute', {method:'POST'}); haptic(); fetchVolume(); };

async function fetchThemeStatus() {
    if (!btnTheme) return;
    try {
        const res = await fetch('/theme');
        if (!res.ok) throw new Error();
        const data = await res.json();
        btnTheme.textContent = data.dark_mode ? '☀️ Light Mode' : '🌙 Dark Mode';
        btnTheme.classList.remove('offline');
        themeStatus.live('theme');
    } catch {
        btnTheme.textContent = 'theme helper offline';
        btnTheme.classList.add('offline');
        themeStatus.dead('theme offline');
    }
}
if (btnTheme) {
    btnTheme.onclick = async () => {
        try {
            const res = await fetch('/theme/dark-mode', {method: 'POST'});
            if (res.ok) haptic(); else setStatus('theme helper offline');
        } catch { setStatus('theme helper offline'); }
        fetchThemeStatus();
    };
    fetchThemeStatus();
    setInterval(fetchThemeStatus, 10000);
}

const btnNightlight = document.getElementById('btn-nightlight');

async function fetchNightlightStatus() {
    if (!btnNightlight) return;
    try {
        const res = await fetch('/nightlight');
        if (!res.ok) throw new Error();
        const data = await res.json();
        btnNightlight.textContent = data.enabled ? '🟠 Warm' : '🔵 Cool';
        btnNightlight.classList.toggle('muted', data.enabled);
        btnNightlight.classList.remove('offline');
        nightlightStatus.live('night light');
    } catch {
        btnNightlight.textContent = '⚪ offline';
        btnNightlight.classList.add('offline');
        nightlightStatus.dead('night light offline');
    }
}

if (btnNightlight) {
    btnNightlight.onclick = async () => {
        try {
            const res = await fetch('/nightlight', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ state: 'toggle' })
            });
            if (res.ok) haptic();
            else setStatus('night light failed');
        } catch {
            setStatus('night light failed');
        }
        fetchNightlightStatus();
    };
    fetchNightlightStatus();
    setInterval(fetchNightlightStatus, 10000);
}

setInterval(() => {
    const now = Date.now();
    if (now - lastUpdate > POLL_INTERVAL - 50) { lastUpdate = now; fetchVolume(); }
}, POLL_INTERVAL);

fetchVolume();
fetchOverlayStatus();
setInterval(fetchOverlayStatus, 10000);
{% if mcp_enabled %}
fetchMcpStatus();
setInterval(fetchMcpStatus, 10000);
{% endif %}

// External changes (Windows Settings, another device, a schedule) can leave
// this page showing stale state for up to one poll interval. The 10s timers
// eventually catch it, but a backgrounded phone won't tick until reopened —
// force an immediate refresh right when the tab actually becomes visible.
document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    fetchVolume();
    fetchOverlayStatus();
    if (btnTheme) fetchThemeStatus();
    if (btnNightlight) fetchNightlightStatus();
    {% if mcp_enabled %}fetchMcpStatus();{% endif %}
});

// ── CC Crawl via MQTT ──
function renderCC() {
    ccInner.innerHTML = '';
    ccBatches.forEach((text, i) => {
        const div = document.createElement('div');
        div.className = 'cc-batch' + (i < ccBatches.length - 1 ? ' old' : '');
        div.textContent = text;
        ccInner.prepend(div);
    });
}
function pushCC(text) {
    ccBatches.push(text);
    if (ccBatches.length > MAX_BATCHES) ccBatches.shift();
    renderCC();
    ccWrap.classList.remove('collapsed');
    ccStatus.live('captions');
}
</script>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
const mqttClient = mqtt.connect("ws://{{ mqtt_ws_url }}");
mqttClient.on("connect", () => {
    mqttClient.subscribe("htpc/captions");
    mqttClient.subscribe("htpc/volume/state");
});
mqttClient.on("message", (topic, message) => {
    const text = message.toString();
    if (topic === "htpc/captions") pushCC(text);
});
mqttClient.on("error", () => {
    ccStatus.dead('reconnecting\u2026');
});
</script>

</body>
</html>
