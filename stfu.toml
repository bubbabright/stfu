# stfu.toml — STFU configuration
# All values below are defaults. Override as needed.

[volume]
step = 1              # percent per button press
default = 20          # initial volume on start

[web]
host = "0.0.0.0"
port = 5000
poll_interval_ms = 1000

[overlay]
enabled = true
poll_interval_ms = 200
transient_duration = 3.0
opacity = 0.78
font_family = "Segoe UI"
font_size_mute = 85
font_size_transient = 72
status_port = 5102     # web.py's /overlay/status relays to this
status_timeout = 1.0   # seconds

[mqtt]
enabled = true
broker = "192.168.1.215"
port = 1883
ws_port = 9001
topic_captions = "htpc/captions"
topic_volume_state = "htpc/volume/state"
topic_volume_set = "htpc/volume/set"

[cc]
enabled = false
tesseract_cmd = 'C:\Program Files\Tesseract-OCR\tesseract.exe'
white_threshold = 500
pixel_threshold = 200
scan_interval = 0.5

[theme]
enabled = true
helper_port = 5100     # night-light-helper's listen port
helper_timeout = 2.0   # seconds; how long web.py waits on the night-light-helper before 503

[nightlight]
enabled = true
wnl_path = "C:\\Users\\Us\\win-nightlight-cli\\target\\release\\wnl.exe"

[mcp]
enabled = false  # off by default — flip on to run MCP again
name = "stfu"
transport = "stdio"
heartbeat_interval = 5.0
heartbeat_stale_after = 15.0

[log]
level = "INFO"
file = "logs/stfu.log"
max_bytes = 5242880
backup_count = 3
